  <script>
    (() => {
      const letters = (el) => {
        const text = el.textContent.trim();
        el.textContent = "";
        text.split("").forEach((ch) => {
          const s = document.createElement("span");
          s.className = "s6-l";
          s.textContent = ch;
          el.appendChild(s);
        });
        return el.querySelectorAll(".s6-l");
      };
      const words = (el) => {
        const text = el.textContent.trim();
        el.textContent = "";
        text.split(/[ \n\t]+/).forEach((w) => {
          const s = document.createElement("span");
          s.className = "s6-w";
          s.textContent = w;
          el.appendChild(s);
          el.appendChild(document.createTextNode(" "));
        });
        return el.querySelectorAll(".s6-w");
      };
      const first = letters(document.getElementById("s6-first"));
      const last = letters(document.getElementById("s6-last"));
      const role = words(document.getElementById("s6-role"));

      const tl = gsap.timeline({ paused: true });

      // Le petit losange devient la carte de contact
      tl.fromTo(
        "#s6-card",
        { x: -330, y: -155, scale: 60 / 900 },
        { x: 0, y: 0, scale: 1, duration: 0.75, ease: "power2.inOut" },
        0.05,
      );
      tl.fromTo("#s6-content", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 0.8);

      // Le portrait revient par la gauche
      tl.fromTo("#s6-portrait", { x: -960 }, { x: 0, duration: 0.8, ease: "expo.out" }, 0.45);

      // Monogramme au trait, nom lettre par lettre, rôle, coordonnées
      tl.fromTo(
        "#s6-mark-line",
        { attr: { "stroke-dashoffset": 100 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.inOut" },
        0.85,
      );
      tl.fromTo("#s6-mark-wl", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.05);
      tl.fromTo(first, { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.035, ease: "power2.out" }, 1.0);
      tl.fromTo(last, { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.035, ease: "power2.out" }, 1.2);
      tl.fromTo("#s6-first, #s6-last", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 1.0);
      tl.fromTo("#s6-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 1.5);
      tl.fromTo(role, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 1.6);
      tl.fromTo(
        "#s6-linkedin, #s6-place1, #s6-place2",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.12, ease: "power2.out" },
        1.85,
      );

      // Le bouton du site apparaît, puis se remplit de rouge
      tl.fromTo("#s6-btn", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 2.2);
      tl.fromTo("#s6-btn-fill", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.inOut" }, 2.95);
      tl.fromTo("#s6-btn-text", { color: "#444444" }, { color: "#ffffff", duration: 0.2, ease: "none" }, 3.05);
      tl.fromTo("#s6-btn", { borderColor: "#8a8a8a" }, { borderColor: "#d9202a", duration: 0.2, ease: "none" }, 2.95);

      window.__timelines["contact"] = tl;
    })();
