  </div>

  <script>
    (() => {
      const DUR = 8.0;

      // Années : une fonction du temps de la scène, rien d'autre
      const YEARS = [
        [3.6, 2006, 2008],
        [4.1, 2008, 2010],
        [4.6, 2010, 2014],
        [5.15, 2014, 2018],
      ];
      const STEP = 0.3;
      const yearEl = document.getElementById("s2-year");
      const yearAt = (t) => {
        let y = YEARS[0][1];
        for (const [start, from, to] of YEARS) {
          if (t >= start + STEP) y = to;
          else if (t > start) {
            const p = (t - start) / STEP;
            const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            y = from + (to - from) * e;
          }
        }
        return Math.round(y);
      };
      const clock = { t: 0 };

      const splitWords = (el, cls) => {
        const text = el.textContent.trim();
        el.textContent = "";
        text.split(/[ \n\t]+/).forEach((word) => {
          const s = document.createElement("span");
          s.className = cls;
          s.textContent = word;
          el.appendChild(s);
          el.appendChild(document.createTextNode(" "));
        });
        return el.querySelectorAll("." + cls);
      };
      const titleWords = [];
      document.querySelectorAll("#s2-title .s2-line").forEach((line) => {
        splitWords(line, "s2-w").forEach((w) => titleWords.push(w));
      });
      const slotAWords = splitWords(document.getElementById("s2-slot-a"), "s2-w");

      const tl = gsap.timeline({ paused: true });

      // Horloge de scène : pilote le compteur d'années
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: () => {
            yearEl.textContent = yearAt(clock.t);
          },
        },
        0,
      );

      // Iris en losange depuis le losange porteur
      tl.fromTo("#s2-world", { "--r": "120px" }, { "--r": "2000px", duration: 0.55, ease: "power2.in" }, 0);

      // Le losange porteur rejoint sa place, à gauche du titre
      tl.fromTo(
        "#s2-carrier",
        { x: 0, y: 0 },
        { x: -490, y: -515, duration: 0.6, ease: "power2.inOut" },
        0.55,
      );

      // Titre mot par mot, puis la ligne d'information du gris clair à l'encre
      tl.fromTo(
        titleWords,
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" },
        0.85,
      );
      tl.fromTo(
        slotAWords,
        { color: "#ffffff" },
        { color: "#6b6b6b", duration: 0.14, stagger: 0.08, ease: "none" },
        1.25,
      );

      // Tampons : l'encre se pose à l'impact, l'échelle s'écrase en 0,12 s
      const hits = [1.7, 2.05, 2.4, 2.75, 3.1];
      hits.forEach((t, i) => {
        const el = "#s2-st" + (i + 1);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t);
        tl.fromTo(el, { scale: 1.22 }, { scale: 1, duration: 0.12, ease: "power4.out" }, t);
      });

      // La ligne bascule sur la progression, synchronisée avec les années
      tl.to("#s2-slot-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 3.45);
      tl.fromTo("#s2-slot-b", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 3.58);
      const roles = [
        ["#s2-r1", 3.6],
        ["#s2-r2", 4.1],
        ["#s2-r3, #s2-r4, #s2-r5", 4.6],
      ];
      roles.forEach(([sel, t]) => {
        tl.fromTo(
          sel,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" },
          t,
        );
      });

      // Le grand tampon « 10+ ANS EN QUALITÉ »
      tl.fromTo("#s2-hero", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 6.0);
      tl.fromTo("#s2-hero", { scale: 1.22 }, { scale: 1, duration: 0.12, ease: "power4.out" }, 6.0);
      tl.to(
        "#s2-head, .s2-slot, .s2-stamp",
        { opacity: 0.12, duration: 0.3, ease: "power2.out" },
        6.0,
      );

      // Le tampon grandit jusqu'à devenir le monde rouge
      tl.to("#s2-hero-text", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 7.4);
      tl.to("#s2-hero", { scale: 5, duration: 0.6, ease: "power2.inOut" }, 7.4);

      window.__timelines["usine"] = tl;
    })();
  </script>
