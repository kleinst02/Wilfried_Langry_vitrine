  <script>
    (() => {
      const DUR = 13.25;

      // Années : 2019 -> 2020 -> 2021 -> 2022 -> 2026, fonction du temps de la scène
      const YEARS = [
        [0.45, 2019, 2020, 0.3],
        [2.2, 2020, 2021, 0.3],
        [6.55, 2021, 2022, 0.3],
        [11.2, 2022, 2026, 0.45],
      ];
      const yearEl = document.getElementById("s4-year");
      const yearAt = (t) => {
        let y = YEARS[0][1];
        for (const [start, from, to, len] of YEARS) {
          if (t >= start + len) y = to;
          else if (t > start) {
            const p = (t - start) / len;
            const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            y = from + (to - from) * e;
          }
        }
        return Math.round(y);
      };
      const clock = { t: 0 };

      const split = (el, cls, byLetter) => {
        const text = el.textContent.trim();
        el.textContent = "";
        const parts = byLetter ? text.split("") : text.split(/[ \n\t]+/);
        parts.forEach((part) => {
          const s = document.createElement("span");
          s.className = cls;
          s.textContent = part === " " ? " " : part;
          el.appendChild(s);
          if (!byLetter) el.appendChild(document.createTextNode(" "));
        });
        return el.querySelectorAll("." + cls);
      };
      const aOver = split(document.getElementById("s4-a-over"), "s4-w");
      const aTitle = split(document.getElementById("s4-a-title"), "s4-l", true);
      const aLine = split(document.getElementById("s4-a-line"), "s4-w");
      const bSql = split(document.getElementById("s4-b-sql"), "s4-w");
      const cOver = split(document.getElementById("s4-c-over"), "s4-w");
      const cTitle = split(document.getElementById("s4-c-title"), "s4-l", true);
      const cSub = split(document.getElementById("s4-c-sub"), "s4-w");

      const blurIn = { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" };
      const blurFrom = { opacity: 0, filter: "blur(6px)" };

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: () => {
            yearEl.textContent = yearAt(clock.t);
          },
        },
        0,
      );

      // Filé : le monde CRM arrive par la droite
      tl.fromTo(
        "#s4-cam",
        { x: 1920, filter: "blur(18px)" },
        { x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.inOut" },
        0,
      );

      // 4a — Selligent CDM, tampon CERTIFIÉ, Scrum Master PSM I
      tl.fromTo(aOver, { color: "#f4f4f4" }, { color: "#6b6b6b", duration: 0.14, stagger: 0.06, ease: "none" }, 0.35);
      tl.fromTo(aTitle, { opacity: 0, filter: "blur(6px)" }, { ...blurIn, duration: 0.16, stagger: 0.03 }, 0.5);
      tl.fromTo("#s4-a-stamp", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 1.05);
      tl.fromTo("#s4-a-stamp", { scale: 1.22 }, { scale: 1, duration: 0.12, ease: "power4.out" }, 1.05);
      tl.fromTo(aLine, blurFrom, { ...blurIn, stagger: 0.067 }, 1.3);
      tl.fromTo(
        "#s4-a-scrum",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "expo.out" },
        1.9,
      );
      tl.fromTo(
        "#s4-a-psm",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.3)" },
        2.2,
      );
      tl.to("#s4-a", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 3.3);

      // 4b — Data et ETL : trois flux qui convergent vers le CRM
      tl.fromTo("#s4-b", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 3.5);
      tl.fromTo("#s4-b-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 3.55);
      ["1", "2", "3"].forEach((n, i) => {
        tl.fromTo("#s4-b-s" + n + ", #s4-b-n" + n, blurFrom, { ...blurIn, duration: 0.16 }, 3.75 + i * 0.15);
        tl.fromTo(
          "#s4-b-l" + n,
          { attr: { "stroke-dashoffset": 100 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" },
          4.15 + i * 0.08,
        );
      });
      tl.fromTo(
        "#s4-b-crm",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.3)" },
        4.6,
      );
      tl.fromTo(bSql, { color: "#f4f4f4" }, { color: "#555555", duration: 0.14, stagger: 0.08, ease: "none" }, 4.6);
      tl.to("#s4-b", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 6.3);

      // 4c — Salesforce
      tl.fromTo("#s4-c", { opacity: 0 }, { opacity: 1, duration: 0.001 }, 6.5);
      tl.fromTo(cOver, { color: "#f4f4f4" }, { color: "#6b6b6b", duration: 0.14, stagger: 0.06, ease: "none" }, 6.55);
      tl.fromTo(cTitle, { opacity: 0, filter: "blur(6px)" }, { ...blurIn, duration: 0.16, stagger: 0.035 }, 6.75);
      tl.fromTo(cSub, blurFrom, { ...blurIn, stagger: 0.067 }, 7.35);
      const slots = [
        ["#s4-c-i1", 8.05, 9.35],
        ["#s4-c-i2", 9.45, 11.05],
        ["#s4-c-i3", 11.15, null],
      ];
      slots.forEach(([sel, tin, tout]) => {
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, tin);
        if (tout) tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, tout);
      });

      // Fin : le CRM s'efface, le losange porteur rejoint le centre et devient une couture
      tl.to("#s4-c", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 12.55);
      tl.to("#s4-year", { opacity: 0, duration: 0.15, ease: "power2.in" }, 12.55);
      tl.to(
        "#s4-carrier",
        { x: 650, y: 255, scaleX: 0.025, scaleY: 16.7, duration: 0.6, ease: "power2.inOut" },
        12.65,
      );

      window.__timelines["crm"] = tl;
    })();
  </script>
